[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-dropout-uq"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "Pillow>=9.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
]

[project.scripts]
mc-train = "mc_dropout.train:main"
mc-serve = "mc_dropout.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]
